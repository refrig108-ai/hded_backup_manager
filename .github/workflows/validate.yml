name: Validate HDED Backup Manager

on:
  push:
    branches:
      - main
      - feature/local-backup-path-0.3.0
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compile Python files
        run: python -m compileall -q hded_backup_manager scripts tests

      - name: Test local storage validation
        run: python -m unittest discover -s tests -v

      - name: Check shell script syntax
        run: bash -n scripts/install_systemd.sh scripts/hded-backup-control scripts/backup_runner.py 2>/dev/null || bash -n scripts/install_systemd.sh scripts/hded-backup-control

      - name: Check JavaScript syntax
        run: node --check hded_backup_manager/hded_backup_manager/page/backup_manager/backup_manager.js
